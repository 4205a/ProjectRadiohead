<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Polirobots">
<meta name="theme-color" content="#0D1117">
<title>Polirobots Intercommunicator</title>
<style>
:root{--bg:#0D1117;--card:#161B22;--border:#30363D;--amber:#F0A520;--green:#3FB950;--red:#F85149;--blue:#1F6FEB;--sub:#8B949E;--text:#C9D1D9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit;outline:none}
button{border:0;cursor:pointer}
.screen{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

/* Login */
#login{align-items:center;justify-content:center;padding:32px;gap:16px;text-align:center}
#login .logo{font-size:56px}
#login h1{font-size:22px;line-height:28px;color:var(--amber)}
#login p{font-size:13px;color:var(--sub)}
.field{width:100%;max-width:420px;padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:transparent;color:#fff;font-size:16px;caret-color:var(--amber)}
.field:focus{border-color:var(--amber)}
.btn{height:48px;border-radius:8px;font-weight:700;color:#fff;padding:0 14px}
.btn.amber{background:var(--amber)} .btn.blue{background:var(--blue)} .btn:disabled{background:var(--border)}
#login .btn{width:100%;max-width:420px}
#loginErr{color:var(--red);font-size:12px}

/* Header */
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0}
header .t{font-size:18px;font-weight:700;color:var(--amber)} header .s{font-size:12px;color:var(--sub)}
header .r{display:flex;align-items:center;gap:6px}
.badge{display:flex;align-items:center;gap:5px;border-radius:20px;padding:4px 8px;font-size:9px;font-weight:700;letter-spacing:1px}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.sq{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:16px}
.link{background:none;color:var(--red);font-size:13px;padding:8px}

/* Cards */
.card{margin:12px 16px 0;padding:14px;border-radius:10px;background:var(--card);border:1px solid var(--border)}
.lbl{font-size:10px;color:var(--sub);font-weight:700;letter-spacing:2px}
.crow{display:flex;gap:8px;margin-top:10px}
.crow .field{flex:1;min-width:0;height:52px;padding:0 12px;font-size:16px}
.crow .btn{height:52px;font-size:13px}
#chErr{color:var(--red);font-size:12px;margin-top:6px}

/* Tabs + list */
.tabs{display:flex;gap:8px;padding:12px 16px 8px;overflow-x:auto}
.chip{flex:none;padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--sub);font-size:12px}
.chip.on{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:700}
#list{flex:1;overflow-y:auto;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;margin-bottom:8px;border-radius:10px;background:var(--card);border:1px solid var(--border)}
.ch.on{border-color:rgba(63,185,80,.4)}
.ch .n{font-size:15px;font-weight:700} .ch .u{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:9px;font-weight:700;color:var(--green);background:rgba(63,185,80,.15);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.sm{height:34px;border-radius:6px;padding:0 12px;font-size:12px;color:#fff;background:var(--blue)}
.sm.out{background:none;color:var(--red);border:1px solid rgba(248,81,73,.5)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 0}
#log{height:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow-y:auto}
#log .h{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
#log .h button{background:none;color:var(--sub);font-size:10px}
#log .e{display:flex;gap:8px;padding:2px 10px;font:11px ui-monospace,Menlo,monospace}
#log .e span:first-child{width:56px;flex:none;color:var(--sub)}

/* PTT panel */
#ptt-panel{border-radius:16px 16px 0 0;background:var(--card);border:1px solid var(--border);padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.tx-row{display:flex;align-items:center;gap:12px}
.tx-row .grow{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px}
.txc{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--border);font-size:12px;color:var(--sub)}
.txc i{width:7px;height:7px;border-radius:50%;background:var(--border)}
.txc.on{background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.5);color:var(--green);font-weight:700} .txc.on i{background:var(--green)}
.rx{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;font-weight:700;letter-spacing:1px;color:var(--border)}
.rx i{width:10px;height:10px;border-radius:50%;background:currentColor}
#ptt{align-self:center;width:120px;height:120px;border-radius:50%;background:var(--blue);border:3px solid rgba(31,111,235,.4);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:background .15s,transform .08s;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#ptt .e{font-size:36px;line-height:1} #ptt .l{font-size:11px;font-weight:700;letter-spacing:2px}
#ptt.pressed{transform:scale(.93)} #ptt:disabled{background:var(--border);border-color:rgba(48,54,61,.4)}
.lock{align-self:center;border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:1px;background:var(--bg);border:1px solid var(--border);color:var(--sub)}
.lock.on{background:rgba(240,165,32,.15);border-color:var(--amber);color:var(--amber)}
#status{text-align:center;font-size:11px;color:var(--sub)}

/* Audio sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:10}
#sheet .in{width:100%;max-height:90dvh;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}
#sheet .top{display:flex;justify-content:space-between;align-items:center}
#sheet .top b{font-size:12px;color:var(--amber);letter-spacing:2px}
#sheet .top button{background:none;color:var(--sub);font-size:12px}
.box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:16px}
.sl .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sl .nm{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:1px}
.sl .v{display:flex;align-items:center;gap:8px}
.sl .bd{font:700 10px ui-monospace,Menlo,monospace;border-radius:6px;padding:3px 8px;border:1px solid}
.sl .rs{width:26px;height:26px;border-radius:6px;background:var(--bg);border:1px solid var(--border);color:var(--sub);font-size:12px}
.sl input{width:100%}
.sl .mk{display:flex;justify-content:space-between;font:8px ui-monospace,Menlo,monospace;color:rgba(139,148,158,.6)}
.note{font-size:11px;color:var(--sub);line-height:16px}
hr{border:0;border-top:1px solid var(--border)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="screen">
  <div class="logo">📡</div>
  <h1>Polirobots<br>Intercommunicator</h1>
  <p>Ingresa tu nombre para continuar</p>
  <input id="nameIn" class="field" placeholder="Nombre de usuario" autocomplete="off" autocapitalize="words" enterkeyhint="go">
  <div id="loginErr"></div>
  <button id="enter" class="btn amber">Entrar</button>
</div>

<!-- MAIN -->
<div id="main" class="screen" hidden>
  <header>
    <div><div class="t">📡 Polirobots</div><div class="s" id="hello"></div></div>
    <div class="r">
      <div class="badge" id="badge"><i></i><span></span></div>
      <button class="sq" id="audioBtn">🔊</button>
      <button class="link" id="logout">Salir</button>
    </div>
  </header>

  <div class="card">
    <div class="lbl">CANALES</div>
    <div class="crow">
      <input id="chIn" class="field" placeholder="Nombre del canal" autocomplete="off" autocapitalize="off">
      <button class="btn amber" id="create">Crear</button>
      <button class="btn blue" id="join">Unirse</button>
    </div>
    <div id="chErr"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="list"></div>

  <div id="ptt-panel">
    <div class="tx-row">
      <div class="grow" id="txWrap"></div>
      <div class="rx" id="rx"><i></i>RX</div>
    </div>
    <button id="ptt"><span class="e"></span><span class="l"></span></button>
    <button class="lock" id="lock">🔓 MIC LOCK</button>
    <div id="status"></div>
  </div>
</div>

<!-- AUDIO SHEET -->
<div id="sheet" hidden>
  <div class="in">
    <div class="top"><b>AUDIO</b><button id="sheetClose">Cerrar</button></div>
    <div class="box">
      <div class="lbl">CONTROL DE VOLUMEN</div>
      <div class="sl" id="slOut"></div>
      <hr>
      <div class="sl" id="slMic"></div>
    </div>
    <div class="note">La salida de audio (altavoz, auricular, Bluetooth) la controla iOS desde el Centro de control.</div>
  </div>
</div>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const dbToLin = db => db <= -79 ? 0 : Math.pow(10, db / 20);
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (_) {} return null; };

const S = {
  name: '', ws: null, conn: 'offline', connecting: false, confirmed: false, pingT: null,
  channels: [], joined: null, tx: {}, ptt: 'IDLE', abort: false, capturing: false,
  rx: false, rxT: null, tab: 0, lock: false, logs: [],
  outDb: parseFloat(store('outDb')) || 0, micDb: parseFloat(store('micDb')) || 0,
};
let ctx = null, proc = null, micStream = null, tones = {}, nextT = 0;

/* ───────── Log ───────── */
function log(msg, lvl = 'info') {
  S.logs.unshift({ t: new Date().toLocaleTimeString('es', { hour12: false }), msg, lvl });
  if (S.logs.length > 120) S.logs.pop();
  if (S.tab === 2) renderList();
}

/* ───────── Audio (Safari: todo arranca desde un toque del usuario) ───────── */
function b64ToBuf(b64) { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }

function resample16k(data, srcRate) {
  const ratio = srcRate / RATE, n = Math.floor(data.length / ratio), out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const p = i * ratio, lo = Math.floor(p), hi = Math.min(lo + 1, data.length - 1), f = p - lo;
    out[i] = Math.max(-1, Math.min(1, data[lo] * (1 - f) + data[hi] * f)) * 32767;
  }
  return out;
}

async function loadTone(b64) {
  try {
    const buf = await new Promise((ok, no) => ctx.decodeAudioData(b64ToBuf(b64), ok, no));
    return resample16k(buf.getChannelData(0), buf.sampleRate);
  } catch (e) { log('Error decodificando audio: ' + e.message, 'warn'); return null; }
}

function initAudio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    try { navigator.audioSession.type = 'playback'; } catch (_) {}
    loadTone(TONE_CONNECT).then(t => { tones.connect = t; if (t) log('Sonidos de radio cargados ✓', 'ok'); });
    loadTone(TONE_RADIO).then(t => tones.radio = t);
  }
  if (ctx.state !== 'running') ctx.resume();
}
document.addEventListener('pointerdown', initAudio);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.name) return;
  keepAwake(); if (ctx) initAudio(); connect();
});

let wake = null;
async function keepAwake() { try { wake = await navigator.wakeLock.request('screen'); } catch (_) {} }

let acc = [], rpos = 0, outq = [];
async function ensureMic() {
  initAudio();
  if (micStream) return true;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) { log('Permiso de micrófono denegado', 'error'); return false; }
  try { navigator.audioSession.type = 'play-and-record'; } catch (_) {}
  const src = ctx.createMediaStreamSource(micStream);
  proc = ctx.createScriptProcessor(1024, 1, 1);
  proc.onaudioprocess = e => {
    if (!S.capturing) { acc = []; outq = []; rpos = 0; return; }
    const inp = e.inputBuffer.getChannelData(0), ratio = ctx.sampleRate / RATE, g = dbToLin(S.micDb);
    for (let i = 0; i < inp.length; i++) acc.push(inp[i]);
    while (rpos + 1 < acc.length) {   // remuestreo lineal en streaming (Safari no deja fijar 16 kHz)
      const lo = Math.floor(rpos), f = rpos - lo;
      outq.push(acc[lo] * (1 - f) + acc[lo + 1] * f);
      rpos += ratio;
    }
    const used = Math.floor(rpos); acc.splice(0, used); rpos -= used;
    while (outq.length >= CHUNK) {
      const pcm = new Int16Array(CHUNK), raw = outq.splice(0, CHUNK);
      for (let i = 0; i < CHUNK; i++) {
        const v = g === 0 ? 0 : g > 1 ? Math.tanh(raw[i] * g) : raw[i] * g;
        pcm[i] = Math.max(-1, Math.min(1, v)) * 32767;
      }
      if (S.ws && S.ws.readyState === 1) S.ws.send(pcm.buffer);
    }
  };
  src.connect(proc); proc.connect(ctx.destination);
  return true;
}

function playPcm(pcm, gainDb) {   // reproduce PCM 16 kHz con jitter buffer de 80 ms
  const g = dbToLin(gainDb), f = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) { const v = pcm[i] / 32768; f[i] = g === 0 ? 0 : g > 1 ? Math.tanh(v * g) : v * g; }
  const b = ctx.createBuffer(1, f.length, RATE); b.copyToChannel(f, 0);
  const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination);
  if (nextT < ctx.currentTime + 0.02) nextT = ctx.currentTime + 0.08;
  s.start(nextT); nextT += b.duration;
}

function onAudio(ab) {
  if (ab.byteLength !== CHUNK * 2 || !ctx) return;
  playPcm(new Int16Array(ab), S.outDb);
  if (!S.rx) { S.rx = true; renderPtt(); }
  clearTimeout(S.rxT); S.rxT = setTimeout(() => { S.rx = false; renderPtt(); }, 400);
}

async function sendPcm(pcm) {   // los tonos también viajan al servidor para que los demás los oigan
  for (let p = 0; p + CHUNK <= pcm.length; p += CHUNK) {
    if (!S.ws || S.ws.readyState !== 1) break;
    S.ws.send(pcm.slice(p, p + CHUNK).buffer);
    await sleep(CHUNK_MS);
  }
}
function playLocal(pcm) { if (ctx) { const g = ctx.createBuffer(1, pcm.length, RATE), f = new Float32Array(pcm.length); for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768; g.copyToChannel(f, 0); const s = ctx.createBufferSource(); s.buffer = g; s.connect(ctx.destination); s.start(); } }

/* ───────── Conexión ───────── */
const send = o => { if (S.ws && S.ws.readyState === 1) S.ws.send(JSON.stringify(o)); };

async function resolveUrl() {
  try {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 4000);
    const r = await fetch(CONFIG, { signal: c.signal }); clearTimeout(t);
    const u = (await r.text()).trim().replace(/^"|"$/g, '');
    return /^wss?:\/\//.test(u) ? u : FALLBACK;
  } catch (_) { log('Config server inalcanzable, usando fallback', 'warn'); return FALLBACK; }
}

async function connect() {
  if (!S.name || S.connecting || (S.ws && S.ws.readyState <= 1)) return;
  S.connecting = true;
  const url = await resolveUrl();
  if (!S.name) { S.connecting = false; return; }
  log('Conectando a ' + url);
  const ws = new WebSocket(url); ws.binaryType = 'arraybuffer'; S.ws = ws;
  ws.onopen = () => {
    if (S.ws !== ws) return;
    S.connecting = false; setConn('online');
    send({ type: 'register', name: S.name });
    log('Conectado ✓', 'ok');
    clearInterval(S.pingT); S.pingT = setInterval(() => send({ type: 'ping' }), 10000);
    const last = store('lastChannel'); if (last) rejoin(last, 0);
  };
  ws.onmessage = e => { if (S.ws !== ws) return; typeof e.data === 'string' ? onSignal(JSON.parse(e.data)) : onAudio(e.data); };
  ws.onclose = ws.onerror = () => { if (S.ws === ws) onDrop(); };
}

function onDrop() {
  S.ws = null; S.connecting = false; S.confirmed = false;
  clearInterval(S.pingT); abortPtt();
  if (S.name) { setConn('reconnecting'); log('Reconectando…', 'warn'); setTimeout(connect, 2000); } else setConn('offline');
}

// El servidor tarda hasta ~25 s en descartar la sesión vieja ("Nombre ya en uso"): reintentar ~30 s
function rejoin(ch, n) {
  setTimeout(() => {
    if (!S.ws || S.ws.readyState !== 1 || S.confirmed) return;
    if (n >= 23) { log('No se pudo volver a [#' + ch + ']', 'warn'); return; }
    send({ type: 'join', channel: ch });
    setTimeout(() => { if (!S.confirmed) rejoin(ch, n + 1); }, 800);
  }, 500);
}

function onSignal(m) {
  switch (m.type) {
    case 'registered': log('Registrado como "' + S.name + '"', 'ok'); S.channels = m.channels || []; break;
    case 'channels': S.channels = m.list || []; break;
    case 'joined':
      S.confirmed = true; S.joined = m.channel; S.tx = { [m.channel]: true }; store('lastChannel', m.channel);
      log('Entraste a [#' + m.channel + ']', 'ok'); break;
    case 'left': log('Saliste del canal', 'warn'); resetChannel(); break;
    case 'channel_created': log('Nuevo canal: [#' + m.channel + '] por ' + m.owner); break;
    case 'channel_deleted': case 'channel_closed':
      if (m.channel === S.joined || m.channel === store('lastChannel')) { log('Canal [#' + m.channel + '] cerrado', 'warn'); resetChannel(); } break;
    case 'user_joined': log(m.name + ' entró al canal'); break;
    case 'user_left': log(m.name + ' salió del canal', 'warn'); break;
    case 'muted': log(m.source === 'admin' ? (m.muted ? '🔇 Muteado por admin' : '🔊 Desmuteado por admin') : (m.muted ? '🔇 Muteado' : '🔊 Desmuteado'), m.muted ? 'warn' : 'info'); break;
    case 'kicked': log('⚠️ ' + (m.message || 'Desconectado por admin'), 'error'); logout(); return;
    case 'error': log('ERROR: ' + m.message, 'error'); break;
  }
  render();
}

function resetChannel() { S.joined = null; S.tx = {}; S.confirmed = false; store('lastChannel', null); abortPtt(); }

/* ───────── Sesión ───────── */
function login(name) {
  S.name = name; store('name', name);
  $('login').hidden = true; $('main').hidden = false;
  keepAwake(); render(); connect();
}
function logout() {
  abortPtt(); store('name', null); store('lastChannel', null);
  S.name = ''; S.joined = null; S.tx = {}; S.channels = []; S.logs = []; S.confirmed = false;
  clearInterval(S.pingT); if (S.ws) { const w = S.ws; S.ws = null; w.close(); }
  try { wake && wake.release(); } catch (_) {}
  setConn('offline');
  $('main').hidden = true; $('login').hidden = false; $('nameIn').value = '';
}

/* ───────── PTT ───────── */
function setPtt(s) { S.ptt = s; renderPtt(); }

async function startTalking() {
  if (S.ptt !== 'IDLE') return;
  if (!S.joined) { log('Únete a un canal para transmitir', 'warn'); renderPtt(); return; }
  if (!S.tx[S.joined]) { log('Selecciona al menos un canal', 'warn'); return; }
  S.abort = false; setPtt('CONNECTING');
  if (!await ensureMic()) { setPtt('IDLE'); return; }
  send({ type: 'talking', talking: true });
  log('🎙️ TX en #' + S.joined, 'ok');
  if (tones.connect) { playLocal(tones.connect); await sendPcm(tones.connect); } else await sleep(200);
  if (S.abort) { await endTx(); return; }
  setPtt('TRANSMITTING'); log('Transmitiendo…', 'ok'); S.capturing = true;
}
function stopTalking() {
  if (S.ptt === 'CONNECTING') S.abort = true;
  else if (S.ptt === 'TRANSMITTING') endTx();
}
async function endTx() {
  if (S.ptt === 'IDLE' || S.ptt === 'ENDING') return;
  setPtt('ENDING'); S.capturing = false;
  if (tones.radio) { playLocal(tones.radio); await sendPcm(tones.radio); } else await sleep(200);
  send({ type: 'talking', talking: false });
  setPtt('IDLE'); log('🔇 TX terminado', 'warn');
}
function abortPtt() {
  S.abort = true; S.capturing = false;
  if (S.ptt !== 'IDLE') send({ type: 'talking', talking: false });
  S.ptt = 'IDLE'; renderPtt();
}

/* ───────── Render ───────── */
function setConn(c) { S.conn = c; renderBadge(); }
function renderBadge() {
  const [col, txt] = S.conn === 'online' ? ['#3FB950', 'EN LÍNEA'] : S.conn === 'reconnecting' ? ['#F0A520', 'RECONECT…'] : ['#F85149', 'OFFLINE'];
  const b = $('badge'); b.style.color = col; b.style.background = col + '1A'; b.style.border = '1px solid ' + col + '4D'; b.lastChild.textContent = txt;
}

function chCard(c, joined) {
  const users = (c.users || []).slice(0, 3).join(', ') + ((c.users || []).length > 3 ? '…' : '');
  const n = c.userCount || 0;
  return `<div class="ch ${joined ? 'on' : ''}"><div style="min-width:0"><div><span class="n">#${esc(c.name)}</span>${joined ? '<span class="tag">EN LÍNEA</span>' : ''}</div>` +
    (n > 0 ? `<div class="u">${n} usuario${n !== 1 ? 's' : ''}${users ? ' · ' + esc(users) : ''}</div>` : '') + `</div>` +
    (joined ? `<button class="sm out" data-leave="${esc(c.name)}">Salir</button>` : `<button class="sm" data-join="${esc(c.name)}">Unirse</button>`) + `</div>`;
}

function renderList() {
  const el = $('list'), mine = S.joined ? [S.channels.find(c => c.name === S.joined) || { name: S.joined, userCount: 0, users: [] }] : [];
  $('tabs').innerHTML = [`Disponibles (${S.channels.length})`, `Mis canales (${mine.length})`, 'Log']
    .map((t, i) => `<button class="chip ${S.tab === i ? 'on' : ''}" data-tab="${i}">${t}</button>`).join('');
  if (S.tab === 0) el.innerHTML = S.channels.length ? S.channels.map(c => chCard(c, c.name === S.joined)).join('') : '<div class="empty">Sin canales disponibles</div>';
  else if (S.tab === 1) el.innerHTML = mine.length ? mine.map(c => chCard(c, true)).join('') : '<div class="empty">No estás en ningún canal</div>';
  else el.innerHTML = `<div id="log"><div class="h"><span class="lbl">REGISTRO DE ACTIVIDAD</span><button data-clear>Limpiar</button></div>` +
    (S.logs.length ? S.logs.map(l => `<div class="e"><span>${l.t}</span><span style="color:${{ ok: '#3FB950', warn: '#F0A520', error: '#F85149' }[l.lvl] || '#C9D1D9'}">${esc(l.msg)}</span></div>`).join('')
      : '<div class="empty">Sin actividad registrada</div>') + '</div>';
}

function renderPtt() {
  const p = S.ptt, has = !!S.joined, busy = p !== 'IDLE';
  $('txWrap').innerHTML = has
    ? `<div class="lbl">TRANSMITIR EN</div><div class="chips">` + [S.joined].map(n => `<button class="txc ${S.tx[n] ? 'on' : ''}" data-tx="${esc(n)}" ${busy ? 'disabled' : ''}><i></i>#${esc(n)}</button>`).join('') + '</div>'
    : '<div style="font-size:12px;color:var(--sub);text-align:center">Únete a un canal para poder transmitir</div>';
  $('rx').style.color = S.rx ? '#3FB950' : '#30363D';
  const btn = $('ptt'), col = { IDLE: has ? '#1F6FEB' : '#30363D', CONNECTING: '#F0A520', TRANSMITTING: '#3FB950', ENDING: '#F0A520' }[p];
  btn.disabled = !has || p === 'ENDING'; btn.style.background = col; btn.style.borderColor = col + '66';
  btn.classList.toggle('pressed', p === 'TRANSMITTING');
  btn.querySelector('.e').textContent = { IDLE: '🎙️', CONNECTING: '⏳', TRANSMITTING: '🔴', ENDING: '⏳' }[p];
  btn.querySelector('.l').textContent = { IDLE: 'PTT', CONNECTING: 'WAIT', TRANSMITTING: 'TX', ENDING: 'END' }[p];
  const panelCol = p === 'TRANSMITTING' ? 'rgba(63,185,80,.6)' : busy ? 'rgba(240,165,32,.6)' : S.rx ? 'rgba(63,185,80,.3)' : '#30363D';
  $('ptt-panel').style.borderColor = panelCol;
  const st = { CONNECTING: ['⏳ ENLAZANDO…', '#F0A520'], TRANSMITTING: ['● TRANSMITIENDO', '#3FB950'], ENDING: ['⏳ CERRANDO…', '#F0A520'] }[p] ||
    [!has ? 'Únete a un canal primero' : !Object.values(S.tx).some(Boolean) ? 'Selecciona al menos un canal' : S.rx ? '● Recibiendo audio' : S.lock ? 'Toca el botón para hablar / detener' : 'Mantén presionado para hablar', S.rx ? '#3FB950' : '#8B949E'];
  $('status').textContent = st[0]; $('status').style.color = st[1]; $('status').style.fontWeight = (busy || S.rx) ? '700' : '400';
  $('lock').className = 'lock' + (S.lock ? ' on' : ''); $('lock').textContent = S.lock ? '🔒 MIC LOCK: ON' : '🔓 MIC LOCK';
}

function render() { $('hello').textContent = 'Hola, ' + S.name; renderBadge(); renderList(); renderPtt(); }

/* ───────── Hoja de audio ───────── */
function slider(el, label, icon, key, color) {
  const v = S[key], fmt = d => d <= DB_MIN ? 'MUTE' : (d > 0 ? '+' : '') + Math.round(d) + ' dB';
  el.innerHTML = `<div class="hd"><div class="v"><span>${icon}</span><span class="nm">${label}</span></div><div class="v"><span class="bd" style="color:${color};background:${color}26;border-color:${color}66">${fmt(v)}</span><button class="rs">↺</button></div></div>` +
    `<input type="range" min="${DB_MIN}" max="${DB_MAX}" step="1" value="${v}" style="accent-color:${color}"><div class="mk"><span>-80</span><span>-40</span><span>0</span><span>+32</span></div>`;
  const set = d => { S[key] = d; store(key, d); el.querySelector('.bd').textContent = fmt(d); el.querySelector('input').value = d; };
  el.querySelector('input').oninput = e => set(+e.target.value);
  el.querySelector('.rs').onclick = () => set(0);
}
function openSheet() { slider($('slOut'), 'CANAL (RECEPCIÓN)', '🔊', 'outDb', '#3FB950'); slider($('slMic'), 'MICRÓFONO (TRANSMISIÓN)', '🎙️', 'micDb', '#F0A520'); $('sheet').hidden = false; }

/* ───────── Eventos ───────── */
$('enter').onclick = () => {
  const n = $('nameIn').value.trim();
  if (!n) { $('loginErr').textContent = 'El nombre no puede estar vacío'; return; }
  initAudio(); login(n);   // el toque de "Entrar" desbloquea el audio en Safari
};
$('nameIn').onkeydown = e => { if (e.key === 'Enter') $('enter').click(); };
$('nameIn').oninput = () => $('loginErr').textContent = '';
$('logout').onclick = logout;
$('audioBtn').onclick = openSheet;
$('sheetClose').onclick = () => $('sheet').hidden = true;
$('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').hidden = true; };

const chName = () => $('chIn').value.trim();
const chFail = () => { $('chErr').textContent = 'Escribe un nombre'; };
$('create').onclick = () => { const c = chName(); if (!c) return chFail(); send({ type: 'create_channel', channel: c }); log('Creando canal [#' + c + ']…'); $('chIn').value = ''; };
$('join').onclick = () => { const c = chName(); if (!c) return chFail(); send({ type: 'join', channel: c }); log('Uniéndose a [#' + c + ']…'); $('chIn').value = ''; };
$('chIn').oninput = () => $('chErr').textContent = '';

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-join],[data-leave],[data-tx],[data-clear]');
  if (!t) return;
  if (t.dataset.tab) { S.tab = +t.dataset.tab; renderList(); }
  else if (t.dataset.join) { send({ type: 'join', channel: t.dataset.join }); log('Uniéndose a [#' + t.dataset.join + ']…'); }
  else if (t.dataset.leave) { send({ type: 'leave', channel: t.dataset.leave }); log('Saliendo de [#' + t.dataset.leave + ']', 'warn'); resetChannel(); render(); }
  else if (t.dataset.tx) { S.tx[t.dataset.tx] = !S.tx[t.dataset.tx]; renderPtt(); }
  else if ('clear' in t.dataset) { S.logs = []; renderList(); }
});

const ptt = $('ptt');
ptt.addEventListener('pointerdown', e => { e.preventDefault(); ptt.setPointerCapture(e.pointerId); initAudio(); if (S.lock) { S.ptt === 'IDLE' ? startTalking() : stopTalking(); } else startTalking(); });
['pointerup', 'pointercancel'].forEach(ev => ptt.addEventListener(ev, () => { if (!S.lock) stopTalking(); }));
ptt.addEventListener('contextmenu', e => e.preventDefault());
$('lock').onclick = () => { S.lock = !S.lock; if (!S.lock) stopTalking(); renderPtt(); };

/* ───────── Arranque ───────── */
const saved = store('name');
if (saved) login(saved);   // sin toque previo: el audio se activa en el primer toque (pointerdown global)
else $('nameIn').focus();
</script>
</body>
</html>
